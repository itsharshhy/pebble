[package]
name = "pebble"
version = "0.1.0"
description = "A calm, private place to set worries down."
authors = ["Pebble contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# The library holds the app so it can be tested; main.rs only starts it.
[lib]
name = "pebble_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# Small, fast release builds (Non-functional requirements N4, N5)
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
