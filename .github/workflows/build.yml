# Builds Pebble's installers on Windows, macOS and Linux and stores them as workflow artifacts.
# Runs by hand (Actions → Build installers → Run workflow) or when a version tag is pushed.
# It publishes a GitHub Release only when "publish" is ticked on a manual run, or for a version
# tag. Both are deliberate, approved actions by the maintainer (AGENTS.md §3.7).
# See docs/handbook/06-release/deployment.md
name: Build installers

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release with these installers (needs the maintainer approval)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04        # older base = AppImage runs on more Linux versions
            args: ''
          - name: windows
            os: windows-latest
            args: ''
          - name: macos
            os: macos-latest
            args: '--target universal-apple-darwin'   # one app for Apple Silicon and Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries Tauri needs
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installers
        run: cargo tauri build ${{ matrix.args }}

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: pebble-${{ matrix.name }}
          retention-days: 30
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    needs: build
    if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from tauri.conf.json
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pebble ${{ steps.version.outputs.version }}
          prerelease: false   # pre-releases are hidden from /releases/latest
          make_latest: true
          body_path: .github/release-notes.md
          files: dist/**/*
          fail_on_unmatched_files: true
