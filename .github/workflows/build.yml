# Builds Pebble's installers on Windows, macOS and Linux and stores them as workflow artifacts.
# Runs by hand (Actions → Build installers → Run workflow) or when a version tag is pushed.
# It never publishes a release: that's a manual, approved step (AGENTS.md §3.7).
# See docs/handbook/06-release/deployment.md
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04        # older base = AppImage runs on more Linux versions
            args: ''
          - name: windows
            os: windows-latest
            args: ''
          - name: macos
            os: macos-latest
            args: '--target universal-apple-darwin'   # one app for Apple Silicon and Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries Tauri needs
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installers
        run: cargo tauri build ${{ matrix.args }}

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: pebble-${{ matrix.name }}
          retention-days: 30
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
